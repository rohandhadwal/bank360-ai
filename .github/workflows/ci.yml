name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f README.md || echo "README.md not added yet"
          test -f .gitignore
          test -d docs
          echo "Repo structure OK"